name: Deploy GramKart PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare GramKart PWA site with GitHub Pages base path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R pwa/. _site/
          touch _site/.nojekyll

          python3 - <<'PY'
          import json, os, struct

          base_raw = os.environ.get("PAGES_BASE_PATH", "").strip("/")
          base_prefix = f"/{base_raw}/" if base_raw else "/"

          manifest_path = os.path.join("_site", "manifest.json")
          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = json.load(f)

          manifest["id"] = base_prefix
          manifest["start_url"] = base_prefix
          manifest["scope"] = base_prefix
          for icon in manifest.get("icons", []):
              src = icon["src"].lstrip("./")
              icon["src"] = f"{base_prefix}{src}"

          with open(manifest_path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")

          # Verify all icon files exist and match declared PNG dimensions
          for icon in manifest.get("icons", []):
              rel = icon["src"].removeprefix(base_prefix).lstrip("/")
              full = os.path.join("_site", rel)
              assert os.path.isfile(full), f"Missing icon: {full}"
              with open(full, "rb") as img:
                  hdr = img.read(24)
                  w, h = struct.unpack(">II", hdr[16:24])
              assert f"{w}x{h}" == icon["sizes"], f"Icon size mismatch: {full}"

          print(f"Configured manifest.json for GitHub Pages base path: {base_prefix}")
          PY

      - name: Validate PWA JS syntax and required assets
        run: |
          node --check _site/app.js
          node --check _site/service-worker.js
          test -f _site/index.html
          test -f _site/styles.css
          test -f _site/manifest.json
          test -f _site/assets/hero.jpg
          test -f _site/assets/empty-cart.jpg
          test -f _site/assets/order-success.jpg

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
